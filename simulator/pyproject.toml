[project]
name = "navagents-simulator"
version = "0.1.0"
description = "Симулятор устройств для платформы коллективной навигационной памяти"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "networkx>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*"]
